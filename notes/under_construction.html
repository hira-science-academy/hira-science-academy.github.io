<!DOCTYPE html>
<html lang="en">
<head>
  <title>Under Construction | Hira Academy</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="5; URL=https://hiraacademy.com.pk/" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      padding: 50px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      max-width: 800px;
      background: rgba(255, 255, 255, 0.95);
      padding: 50px 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
    }

    h1 {
      color: #333;
      font-size: 2.8em;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .highlight {
      color: #667eea;
      font-weight: 800;
    }

    p {
      font-size: 1.3em;
      color: #555;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .redirect-timer {
      font-size: 1.1em;
      color: #777;
      margin: 25px 0;
      background: #f8f9fa;
      padding: 15px;
      border-radius: 10px;
      display: inline-block;
    }

    .timer {
      font-weight: bold;
      color: #667eea;
      font-size: 1.3em;
    }

    .button-group {
      margin-top: 40px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 35px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1.1em;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
    }

    .btn-secondary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      opacity: 0.9;
    }

    .btn-secondary:hover {
      opacity: 1;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 30px;
      background: white;
      border-radius: 50%;
      padding: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .construction-icon {
      font-size: 3em;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    @media (max-width: 768px) {
      .container {
        padding: 40px 25px;
        margin: 20px;
      }
      
      h1 {
        font-size: 2.2em;
        flex-direction: column;
        gap: 10px;
      }
      
      .button-group {
        flex-direction: column;
        align-items: center;
      }
      
      .btn {
        width: 100%;
        max-width: 300px;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 15px;
      }
      
      .container {
        padding: 30px 20px;
      }
      
      h1 {
        font-size: 1.8em;
      }
      
      p {
        font-size: 1.1em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="construction-icon">🚧</div>
    <h1><span class="highlight">Page</span> Under Construction</h1>
    
    <p>
      We're working hard to bring you an amazing learning experience. 
      This section is currently being developed and will be available soon.
    </p>
    
    <div class="redirect-timer">
      Redirecting to homepage in <span id="countdown" class="timer">5</span> seconds...
    </div>
    
    <div class="button-group">
      <a href="https://hiraacademy.com.pk/" class="btn">
        <span>🏠</span> Go to Homepage
      </a>
      <a href="https://hiraacademy.com.pk/#courses" class="btn btn-secondary">
        <span>📚</span> Browse Available Courses
      </a>
    </div>
  </div>

  <script>
    // Countdown timer
    let seconds = 5;
    const countdownElement = document.getElementById('countdown');
    
    const countdownInterval = setInterval(() => {
      seconds--;
      countdownElement.textContent = seconds;
      
      if (seconds <= 0) {
        clearInterval(countdownInterval);
        window.location.href = "https://hiraacademy.com.pk/";
      }
    }, 1000);
    
    // Manual redirect button functionality
    document.querySelector('.btn').addEventListener('click', function(e) {
      e.preventDefault();
      window.location.href = "https://hiraacademy.com.pk/";
    });
  </script>
</body>
</html>
